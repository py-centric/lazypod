name: CLA Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cla-check:
    name: Verify CLA Signature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/cla-signatures.json
          sparse-checkout-cone-mode: false

      - name: Check CLA signature
        id: check-cla
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const prAuthor = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;
            const prUrl = context.payload.pull_request.html_url;
            const today = new Date().toISOString().split('T')[0];

            // Read signatures file
            let signatures = { signatures: [] };
            try {
              const content = fs.readFileSync('.github/cla-signatures.json', 'utf8');
              signatures = JSON.parse(content);
            } catch (err) {
              core.warning('Could not read cla-signatures.json, treating as empty');
            }

            // Check if PR author has signed
            const hasSigned = signatures.signatures.some(
              sig => sig.github && sig.github.toLowerCase() === prAuthor.toLowerCase()
            );

            if (hasSigned) {
              core.info(`✅ CLA signed by @${prAuthor}`);
              core.setOutput('signed', 'true');
              return;
            }

            // Check if PR body contains CLA agreement comment
            const prBody = (context.payload.pull_request.body || '').toLowerCase();
            const hasCommentSignature = prBody.includes('i have read and agree to the contributor license agreement');

            if (hasCommentSignature) {
              core.info(`✅ CLA agreement found in PR body by @${prAuthor}`);
              core.setOutput('signed', 'true');
              return;
            }

            core.setOutput('signed', 'false');

            // Post a comment with instructions
            const lines = [
              '## ❌ Contributor License Agreement Required',
              '',
              `Hi @${prAuthor}! Thank you for your contribution.`,
              '',
              'Before this pull request can be merged, you need to sign the [Contributor License Agreement (CLA)](.github/CLA.md).',
              '',
              '### How to Sign',
              '',
              '**Option 1: Add your signature to the signatures file**',
              '',
              'Add an entry to `.github/cla-signatures.json` with your information:',
              '',
              '```json',
              '{',
              '  "name": "Your Full Name",',
              '  "email": "your.email@example.com",',
              `  "github": "${prAuthor}",`,
              `  "date": "${today}",`,
              `  "contribution_url": "${prUrl}"`,
              '}',
              '```',
              '',
              '**Option 2: Comment on this PR**',
              '',
              'Add a comment with the following text:',
              '',
              '```',
              'I have read and agree to the Contributor License Agreement (CLA).',
              'Name: Your Full Name',
              'Email: your.email@example.com',
              `Date: ${today}`,
              '```',
              '',
              'After signing, the CLA check will pass automatically.',
              '',
              '---',
              '*This check ensures all contributors have agreed to the terms in [CLA.md](.github/CLA.md), which includes copyright assignment and license grants.*',
            ];
            const comment = lines.join('\n');

            // Check if bot already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes('Contributor License Agreement Required')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment,
              });
            }

      - name: Fail if CLA not signed
        if: steps.check-cla.outputs.signed == 'false'
        run: |
          echo "::error::CLA not signed by PR author. Please sign the Contributor License Agreement."
          exit 1
