name: Version Bump

on:
  push:
    branches:
      - 'feat/*'
      - 'feature/*'
      - 'fix/*'
      - 'bugfix/*'
      - 'release/*'
      - 'breaking/*'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Calculate and Apply Version Bump
        run: |
          # Get current version from Cargo.toml
          VERSION=$(grep "^version =" Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $VERSION"
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Get branch name
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Branch name: $BRANCH_NAME"
          
          if [[ $BRANCH_NAME == fix/* ]] || [[ $BRANCH_NAME == bugfix/* ]]; then
              PATCH=$((PATCH + 1))
              TYPE="patch"
          elif [[ $BRANCH_NAME == feat/* ]] || [[ $BRANCH_NAME == feature/* ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              TYPE="minor"
          elif [[ $BRANCH_NAME == release/* ]] || [[ $BRANCH_NAME == breaking/* ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              TYPE="major"
          else
              echo "Branch does not match prefix for auto-bump. Exiting."
              exit 0
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION ($TYPE bump)"
          
          # Update Cargo.toml
          sed -i "s/^version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml
          
          # Update docs/conf.py
          if [ -f docs/conf.py ]; then
              sed -i "s/release = '$VERSION'/release = '$NEW_VERSION'/" docs/conf.py
          fi
          
          # Update Cargo.lock
          cargo update -p lazypod
          
          # Commit and push
          git add Cargo.toml Cargo.lock docs/conf.py
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin $BRANCH_NAME
