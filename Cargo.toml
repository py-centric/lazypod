[package]
name = "lazypod"
version = "0.1.0"
edition = "2021"
authors = ["v <v@example.com>"]
description = "A terminal UI for Podman"
license = "MIT"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
arboard = "3.6.1"
async-trait = "0.1.89"
